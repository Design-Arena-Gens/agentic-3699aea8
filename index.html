<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WB?SHOP ? Affiliate Catalog</title>
    <meta name="description" content="WB?SHOP: A minimal, high-performance affiliate product catalog aggregated via Sovrn Commerce." />
    <meta name="p:domain_verify" content="VERIFY_WITH_PINTEREST" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Helvetica Neue', 'Helvetica', 'Arial', 'Noto Sans', 'sans-serif'],
            },
            colors: {
              accent: {
                DEFAULT: '#2563EB', // subtle action color (blue-600)
                hover: '#1D4ED8'
              },
            },
          },
        },
        corePlugins: {
          container: false,
        }
      }
    </script>
    <style>
      /* Swiss style: tight grid, sharp edges, high contrast */
      html, body { background: #ffffff; color: #0a0a0a; }
      /* Masonry helpers */
      .masonry { column-gap: 1.25rem; }
      .masonry > * { break-inside: avoid; }
      /* Focus ring minimalist */
      .focus-ring:focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }
    </style>
    <script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  </head>
  <body class="font-sans antialiased">
    <div id="app" class="min-h-screen flex flex-col">
      <!-- Header -->
      <header class="border-b border-black/10">
        <div class="mx-auto w-full max-w-7xl px-5 py-6">
          <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
            <div>
              <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">WB?SHOP</h1>
              <p class="text-sm text-black/60 mt-1">Affiliate Catalog ? Sovrn Commerce</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 w-full md:w-auto">
              <div class="md:col-span-2">
                <label class="sr-only" for="search">Search products</label>
                <input
                  id="search"
                  type="search"
                  v-model="searchInput"
                  @input="onSearchInput"
                  placeholder="Search products?"
                  class="focus-ring w-full border border-black/20 rounded px-3 py-2 text-sm placeholder:text-black/40"
                  autocomplete="off"
                />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <label class="sr-only" for="sort">Sort by</label>
                <select id="sort" v-model="sortBy" @change="onSortChange"
                  class="focus-ring border border-black/20 rounded px-3 py-2 text-sm bg-white">
                  <option value="relevance">Relevance</option>
                  <option value="price_asc">Price ? Low to High</option>
                  <option value="price_desc">Price ? High to Low</option>
                </select>
                <label class="sr-only" for="retailer">Retailer filter</label>
                <input
                  id="retailer"
                  type="text"
                  v-model="retailerFilter"
                  @change="onFilterChange"
                  placeholder="Retailer"
                  class="focus-ring border border-black/20 rounded px-3 py-2 text-sm placeholder:text-black/40"
                />
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="flex-1">
        <section class="mx-auto w-full max-w-7xl px-5 py-8">
          <!-- Stats / status -->
          <div class="flex items-center justify-between mb-5">
            <div class="text-xs text-black/50">
              <span v-if="!loading && !error">{{ totalText }}</span>
              <span v-else-if="loading">Loading?</span>
              <span v-else class="text-red-600">Failed to load products.</span>
            </div>
            <button
              @click="refresh"
              class="focus-ring text-xs uppercase tracking-wider border border-black/20 rounded px-3 py-2 hover:bg-black hover:text-white transition"
            >
              Refresh
            </button>
          </div>

          <!-- Grid -->
          <div class="masonry columns-1 sm:columns-2 lg:columns-4">
            <!-- Product Card -->
            <article
              v-for="p in products"
              :key="p.id"
              class="inline-block align-top mb-5 w-full border border-black/10 rounded overflow-hidden bg-white"
            >
              <div class="relative bg-black/3">
                <img
                  :src="p.imageUrl"
                  :alt="p.title"
                  class="w-full h-auto object-cover"
                  loading="lazy"
                  @error="onImgError($event)"
                />
              </div>
              <div class="p-4 space-y-2">
                <div class="text-[10px] uppercase tracking-wider text-black/50">{{ p.retailer }}</div>
                <h3 class="text-sm font-medium leading-snug">
                  {{ p.title }}
                </h3>
                <div class="flex items-baseline justify-between">
                  <div class="text-lg font-semibold">
                    {{ formatPrice(p.price, p.currency) }}
                  </div>
                  <div v-if="p.category" class="text-[10px] uppercase tracking-wider text-black/50">
                    {{ p.category }}
                  </div>
                </div>
                <div class="pt-1">
                  <a
                    class="focus-ring inline-flex items-center justify-center w-full text-sm font-medium border border-black/80 rounded px-3 py-2 hover:bg-black hover:text-white transition"
                    :href="p.productUrl"
                    target="_blank"
                    rel="nofollow sponsored noopener"
                  >
                    View
                  </a>
                </div>
              </div>
            </article>

            <!-- Skeletons -->
            <template v-if="loading">
              <div v-for="n in 8" :key="'s'+n" class="inline-block align-top mb-5 w-full">
                <div class="animate-pulse border border-black/10 rounded overflow-hidden">
                  <div class="bg-black/5" style="height: 220px;"></div>
                  <div class="p-4 space-y-2">
                    <div class="h-3 bg-black/10 rounded w-24"></div>
                    <div class="h-4 bg-black/10 rounded w-3/4"></div>
                    <div class="h-3 bg-black/10 rounded w-1/3"></div>
                    <div class="h-8 bg-black/10 rounded w-full mt-2"></div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Sentinel for infinite scroll -->
          <div ref="sentinel" class="h-10"></div>

          <!-- Empty state -->
          <div v-if="!loading && products.length === 0" class="text-center text-sm text-black/50 py-10">
            No products found. Try a different search.
          </div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="border-t border-black/10">
        <div class="mx-auto w-full max-w-7xl px-5 py-6 text-xs text-black/50 flex items-center justify-between">
          <div>? <span>{{ year }}</span> WB?SHOP</div>
          <div>
            <a href="#" class="hover:text-black">Privacy</a>
            <span class="mx-2">?</span>
            <a href="#" class="hover:text-black">Terms</a>
          </div>
        </div>
      </footer>
    </div>

    <script>
      const { createApp, ref, computed, onMounted, watch } = Vue;

      createApp({
        setup() {
          const products = ref([]);
          const loading = ref(false);
          const error = ref(null);
          const page = ref(1);
          const perPage = 24;
          const hasMore = ref(true);

          const searchInput = ref('');
          const search = ref('');
          const retailerFilter = ref('');
          const sortBy = ref('relevance');

          const debounceTimer = ref(null);
          const sentinel = ref(null);

          const year = new Date().getFullYear();

          const totalText = computed(() => {
            const c = products.value.length;
            const q = search.value ? ` for ?${search.value}?` : '';
            return `${c} item${c === 1 ? '' : 's'}${q}`;
          });

          function formatPrice(amount, currency) {
            const safeAmount = Number(amount || 0);
            try {
              return new Intl.NumberFormat(undefined, {
                style: 'currency',
                currency: currency || 'USD',
                maximumFractionDigits: 2
              }).format(safeAmount);
            } catch {
              return `$${safeAmount.toFixed(2)}`;
            }
          }

          function onImgError(e) {
            e.target.src = 'https://dummyimage.com/800x600/efefef/aaaaaa&text=No+Image';
          }

          function onSearchInput() {
            if (debounceTimer.value) clearTimeout(debounceTimer.value);
            debounceTimer.value = setTimeout(() => {
              search.value = (searchInput.value || '').trim();
              refresh();
            }, 350);
          }

          function onSortChange() {
            refresh();
          }

          function onFilterChange() {
            refresh();
          }

          async function fetchProducts({ reset = false } = {}) {
            if (loading.value) return;
            loading.value = true;
            error.value = null;
            try {
              const params = new URLSearchParams({
                q: search.value || '',
                sort: sortBy.value || 'relevance',
                retailer: retailerFilter.value || '',
                page: String(page.value),
                perPage: String(perPage),
              });
              const res = await fetch(`/api/products?${params.toString()}`, { headers: { 'Accept': 'application/json' } });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              const items = Array.isArray(data.items) ? data.items : [];
              if (reset) {
                products.value = items;
              } else {
                products.value = products.value.concat(items);
              }
              hasMore.value = items.length >= perPage;
            } catch (err) {
              console.error(err);
              if (reset) products.value = [];
              hasMore.value = false;
              error.value = err;
            } finally {
              loading.value = false;
            }
          }

          function refresh() {
            page.value = 1;
            hasMore.value = true;
            fetchProducts({ reset: true });
          }

          function loadMoreIfNeeded() {
            if (loading.value || !hasMore.value) return;
            page.value += 1;
            fetchProducts();
          }

          onMounted(() => {
            // Initial fetch
            fetchProducts({ reset: true });
            // Infinite scroll via IntersectionObserver
            const io = new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  loadMoreIfNeeded();
                }
              });
            }, { rootMargin: '800px 0px 800px 0px' });
            if (sentinel.value) io.observe(sentinel.value);
          });

          watch([() => search.value, () => retailerFilter.value, () => sortBy.value], () => {
            // Search/filter/sort handled via refresh; watchers are secondary safety
          });

          return {
            // state
            products, loading, error, page, hasMore,
            searchInput, search, retailerFilter, sortBy,
            sentinel, year,
            // computed
            totalText,
            // methods
            refresh, onImgError, formatPrice, onSearchInput, onSortChange, onFilterChange,
          };
        }
      }).mount('#app');
    </script>
  </body>
  </html>
